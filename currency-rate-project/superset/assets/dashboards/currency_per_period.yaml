  MARKDOWN-49_kDPYYRiSZgxREz6khu:
    children: []
    id: MARKDOWN-49_kDPYYRiSZgxREz6khu
    meta:
      code: "### \u041F\u043E\u044F\u0441\u043D\u0435\u043D\u0438\u044F \u043A \u043F\
        \u0430\u043D\u0435\u043B\u0438\n\n---\n\n**\u0414\u0438\u043D\u0430\u043C\u0438\
        \u043A\u0430 \u043A\u0443\u0440\u0441\u0430** - \u0434\u043D\u0435\u0432\u043D\
        \u043E\u0439 \u043A\u0443\u0440\u0441 \u0438 \u0435\u0433\u043E \u0441\u043A\
        \u043E\u043B\u044C\u0437\u044F\u0449\u0435\u0435 \u0441\u0440\u0435\u0434\u043D\
        \u0435\u0435 \u0437\u0430 7 \u0434\u043D\u0435\u0439 (MA7), \u043A\u043E\u0442\
        \u043E\u0440\u043E\u0435 \u0441\u0433\u043B\u0430\u0436\u0438\u0432\u0430\u0435\
        \u0442 \u043A\u0440\u0430\u0442\u043A\u043E\u0441\u0440\u043E\u0447\u043D\u044B\
        \u0435 \u043A\u043E\u043B\u0435\u0431\u0430\u043D\u0438\u044F. \n\n**\u041E\
        \u0442\u043A\u043B\u043E\u043D\u0435\u043D\u0438\u0435 \u043A\u0443\u0440\u0441\
        \u0430 \u043E\u0442 MA7** - \u043D\u0430 \u0441\u043A\u043E\u043B\u044C\u043A\
        \u043E \u043F\u0440\u043E\u0446\u0435\u043D\u0442\u043E\u0432 \u043A\u0443\
        \u0440\u0441 \u043E\u0442\u043B\u0438\u0447\u0430\u0435\u0442\u0441\u044F\
        \ \u043E\u0442 MA7:\n- \u0437\u043D\u0430\u0447\u0435\u043D\u0438\u044F \u0432\
        \u044B\u0448\u0435 \u043D\u0443\u043B\u044F = \u043A\u0443\u0440\u0441 \u0432\
        \u044B\u0448\u0435 \u043D\u0435\u0434\u0435\u043B\u044C\u043D\u043E\u0439\
        \ \u043D\u043E\u0440\u043C\u044B;\n- \u0437\u043D\u0430\u0447\u0435\u043D\u0438\
        \u044F \u043D\u0438\u0436\u0435 \u043D\u0443\u043B\u044F = \u043A\u0443\u0440\
        \u0441 \u043D\u0438\u0436\u0435 \u043D\u0435\u0434\u0435\u043B\u044C\u043D\
        \u043E\u0439 \u043D\u043E\u0440\u043C\u044B.\n\n\u041D\u0430\u043A\u043B\u043E\
        \u043D MA7 \u043E\u0442\u0440\u0430\u0436\u0430\u0435\u0442 \u043D\u0430\u043F\
        \u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u0442\u0440\u0435\u043D\u0434\
        \u0430, \u043A\u043E\u0440\u043E\u0442\u043A\u0438\u0435 \u043F\u0438\u043A\
        \u0438 \u043E\u0442\u043A\u043B\u043E\u043D\u0435\u043D\u0438\u044F \u0441\
        \ \u0431\u044B\u0441\u0442\u0440\u044B\u043C \u0432\u043E\u0437\u0432\u0440\
        \u0430\u0442\u043E\u043C \u043A \u043D\u0443\u043B\u044E \u0443\u043A\u0430\
        \u0437\u044B\u0432\u0430\u044E\u0442 \u043D\u0430 \u0440\u0430\u0437\u043E\
        \u0432\u044B\u0435 \u0432\u044B\u0431\u0440\u043E\u0441\u044B, \u0430 \u0443\
        \u0441\u0442\u043E\u0439\u0447\u0438\u0432\u043E\u0435 \u043E\u0442\u043A\u043B\
        \u043E\u043D\u0435\u043D\u0438\u0435 \u0432 \u043E\u0434\u043D\u0443 \u0441\
        \u0442\u043E\u0440\u043E\u043D\u0443 \u0433\u043E\u0432\u043E\u0440\u0438\u0442\
        \ \u043E \u0441\u0434\u0432\u0438\u0433\u0435 \u0443\u0440\u043E\u0432\u043D\
        \u044F \u043A\u0443\u0440\u0441\u0430. \u041F\u0430\u043D\u0435\u043B\u0438\
        \ \u043E\u043F\u0438\u0441\u044B\u0432\u0430\u044E\u0442 \u043F\u0440\u043E\
        \u0448\u043B\u0443\u044E \u0434\u0438\u043D\u0430\u043C\u0438\u043A\u0443\
        \ \u0438 \u043D\u0435 \u044F\u0432\u043B\u044F\u044E\u0442\u0441\u044F \u043F\
        \u0440\u043E\u0433\u043D\u043E\u0437\u043E\u043C.\n\n---\n\n**\u0422\u043E\
