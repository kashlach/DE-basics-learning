        \u043E\u0441\u0442\u0438** - 10 \u0432\u0430\u043B\u044E\u0442 \u0441 \u043D\
        \u0430\u0438\u0431\u043E\u043B\u044C\u0448\u0438\u043C \u043A\u043E\u043B\u0435\
        \u0431\u0430\u043D\u0438\u0435\u043C \u0441\u0442\u043E\u0438\u043C\u043E\u0441\
        \u0442\u0438 \u0437\u0430 \u043F\u0435\u0440\u0438\u043E\u0434. \u0412\u043E\
        \u043B\u0430\u0442\u0438\u043B\u044C\u043D\u043E\u0441\u0442\u044C \u0432\u044B\
        \u0447\u0438\u0441\u043B\u0435\u043D\u0430 \u043A\u0430\u043A \u0441\u0442\
        \u0430\u043D\u0434\u0430\u0440\u0442\u043D\u043E\u0435 \u043E\u0442\u043A\u043B\
        \u043E\u043D\u0435\u043D\u0438\u0435 \u043F\u043E \u0432\u044B\u0431\u043E\
        \u0440\u043A\u0435 \u0434\u043D\u0435\u0432\u043D\u044B\u0445 \u0438\u0437\
        \u043C\u0435\u043D\u0435\u043D\u0438\u0439 \u043A\u0443\u0440\u0441\u0430\
        \ \u0432 \u043F\u0440\u043E\u0446\u0435\u043D\u0442\u0430\u0445.\n\n---"
