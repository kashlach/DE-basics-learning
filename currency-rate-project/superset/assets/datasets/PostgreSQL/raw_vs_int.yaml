catalog: currency_db
schema: finance_int
sql: "SELECT\r\n    COALESCE(r.request_date, i.requested_date) AS dt,\r\n    r.currency_cnt\
  \ AS raw_cnt,\r\n    i.currency_cnt AS int_cnt,\r\n    COALESCE(r.currency_cnt,0)\
  \ - COALESCE(i.currency_cnt,0) AS diff\r\nFROM (\r\n    SELECT request_date, (SELECT\
  \ COUNT(*) FROM jsonb_object_keys(raw_json->'Valute')) AS currency_cnt\r\n    FROM\
  \ raw.currency_rates_raw\r\n) r\r\nFULL JOIN (\r\n    SELECT requested_date, COUNT(DISTINCT\
  \ char_code) AS currency_cnt\r\n    FROM finance_int.int_daily_rates\r\n    GROUP\
  \ BY requested_date\r\n) i ON r.request_date = i.requested_date"
