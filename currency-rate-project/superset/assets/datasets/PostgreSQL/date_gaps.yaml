cache_timeout: null
catalog: currency_db
schema: raw
sql: "SELECT\n  calenda::DATE AS dt,\n  EXTRACT(ISODOW FROM calenda::TIMESTAMP) AS\
  \ weekday,\n  request_date IS NULL AS is_missed,\n  CASE \n    WHEN EXTRACT(ISODOW\
  \ FROM calenda::TIMESTAMP) <= 5\n    THEN '\u0431\u0443\u0434\u043D\u0438\u0439\
  '\n    ELSE '\u0432\u044B\u0445\u043E\u0434\u043D\u043E\u0439' \n  END AS day_type\n\
  FROM generate_series(\n      (SELECT MIN(request_date) FROM raw.currency_rates_raw)::DATE,\
  \ \n      CURRENT_DATE /*- INTERVAL '1' DAY*/, \n      '1 day') AS calenda\nLEFT\
  \ JOIN raw.currency_rates_raw ON request_date = calenda::DATE"
