table_name: period_change_pct
main_dttm_col: requested_date
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: currency_db
schema: null
sql: "{%- set codes  = filter_values('char_code', default='USD', remove_filter=True)\
  \ -%}\r\n{%- set d_from = \"'\" ~ from_dttm ~ \"'::date\" if from_dttm else \"(CURRENT_DATE\
  \ - 90)\" -%}\r\n{%- set d_to   = \"'\" ~ to_dttm   ~ \"'::date\" if to_dttm   else\
  \ \"(CURRENT_DATE + 1)\" -%}\r\nSELECT DISTINCT\r\n  char_code,\r\n  LAST_VALUE(requested_date)\
  \ OVER w AS requested_date,\r\n  ROUND((LAST_VALUE(rate) OVER w / NULLIF(FIRST_VALUE(rate)\
  \ OVER w, 0) - 1) * 100, 2)\r\n    AS period_change_pct\r\nFROM finance_int.int_daily_rates\r\
  \nWHERE char_code IN {{ codes | where_in }}\r\n  AND requested_date >= {{ d_from\
  \ }} AND requested_date < {{ d_to }}\r\nWINDOW w AS (\r\n  PARTITION BY char_code\
  \ ORDER BY requested_date\r\n  ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\r\
  \n)"
