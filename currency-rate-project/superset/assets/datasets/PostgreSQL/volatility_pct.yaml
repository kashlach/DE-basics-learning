table_name: volatility_pct
main_dttm_col: requested_date
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: currency_db
schema: finance_int
sql: "{%- set d_from = \"'\" ~ from_dttm ~ \"'::date\" if from_dttm else \"(CURRENT_DATE\
  \ - 90)\" -%}\r\n{%- set d_to   = \"'\" ~ to_dttm   ~ \"'::date\" if to_dttm   else\
  \ \"(CURRENT_DATE + 1)\" -%}\r\n\r\nSELECT\r\n  char_code,\r\n  MAX(currency_name)\
  \                      AS currency_name,\r\n  ROUND(stddev_samp(daily_change_pct),\
  \ 3) AS volatility_pct,\r\n  COUNT(daily_change_pct)                 AS n_obs,\r\
  \n  MAX(requested_date)                     AS requested_date\r\nFROM finance_int.int_daily_rates\r\
  \nWHERE daily_change_pct IS NOT NULL\r\n  AND requested_date >= {{ d_from }} AND\
  \ requested_date < {{ d_to }}\r\n  AND char_code <> 'IRR' --\u0438\u0437-\u0437\u0430\
  \ \u043E\u043A\u0440\u0443\u0433\u043B\u0435\u043D\u0438\u044F \u0432\u0435\u0437\
  \u0434\u0435 0.0001 \u0438\u043B\u0438 0.0000\r\nGROUP BY char_code\r\nHAVING COUNT(daily_change_pct)\
  \ >= 5\r\nORDER BY volatility_pct DESC\r\nLIMIT 10"
