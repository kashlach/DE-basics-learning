catalog: currency_db
schema: finance_int
sql: "{%- set codes  = filter_values('char_code', default='USD', remove_filter=True)\
  \ -%}\r\n{%- set d_from = \"'\" ~ from_dttm ~ \"'::date\" if from_dttm else \"(CURRENT_DATE\
  \ - 90)\" -%}\r\n{%- set d_to   = \"'\" ~ to_dttm   ~ \"'::date\" if to_dttm   else\
  \ \"(CURRENT_DATE + 1)\" -%}\r\n\r\nWITH p AS (\r\n  SELECT requested_date, rate\r\
  \n  FROM finance_int.int_daily_rates\r\n  WHERE char_code IN {{ codes | where_in\
  \ }}\r\n    AND requested_date >= {{ d_from }} AND requested_date < {{ d_to }}\r\
  \n)\r\n\r\n(SELECT '\u041C\u0438\u043D\u0438\u043C\u0443\u043C \u0437\u0430 \u043F\
  \u0435\u0440\u0438\u043E\u0434' AS metric, rate, requested_date FROM p\r\nORDER\
  \ BY rate ASC,  requested_date DESC LIMIT 1)\r\nUNION ALL\r\n(SELECT '\u041C\u0430\
  \u043A\u0441\u0438\u043C\u0443\u043C \u0437\u0430 \u043F\u0435\u0440\u0438\u043E\
  \u0434', rate, requested_date FROM p\r\nORDER BY rate DESC, requested_date DESC\
  \ LIMIT 1)"
