[project]
name = "currency-rate-project"
version = "0.1.0"
description = "ELT-пайплайн для курсов валют ЦБ РФ"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]
postgres = [
    "psycopg2-binary>=2.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # ошибки стиля
    "W",   # предупреждения
    "F",   # pyflakes (неиспользуемые переменные и т.д.)
    "I",   # порядок импортов
    "UP",  # синтаксис
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
