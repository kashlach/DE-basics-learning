currency_dbt:  
  outputs:
    dev:
      type: postgres
      threads: 1
      host: localhost
      port: 5432
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PWD') }}"
      dbname: "{{ env_var('DB_NAME') }}"
      schema: dev_finance
    
    prod:
      type: postgres
      threads: 4
      host: postgres
      port: 5432
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PWD') }}"
      dbname: "{{ env_var('DB_NAME') }}"
      schema: finance
      
  target: dev
